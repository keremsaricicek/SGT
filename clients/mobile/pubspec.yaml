name: sgt_mobile
description: "SGT S Plus mobil uygulaması (iOS/Android). Spec 014."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_ui: ^1.1.7
  decimal: ^3.2.6
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_appauth: ^13.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
