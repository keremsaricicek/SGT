name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgt
          POSTGRES_PASSWORD: sgt_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SGT_TEST_DB: Host=localhost;Username=sgt;Password=sgt_ci_only
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Sgt.slnx
      - name: Build (uyarı = hata)
        run: dotnet build Sgt.slnx --no-restore -c Release
      - name: Test (unit, entegrasyon, mimari, API)
        run: dotnet test Sgt.slnx --no-build -c Release
